<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4ee">
  <title>晚风骑行 · 和你一起慢慢走</title>
  <style>
    :root { color-scheme: light; --paper:#f6f4ee; --ink:#303b39; --muted:#8b918a; --green:#526b53; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:3px solid #8daa79; outline-offset:5px; }
    .page { max-width:1512px; margin:0 auto; padding:30px 54px 22px; }
    header { display:flex; align-items:center; justify-content:space-between; padding-bottom:25px; border-bottom:1px solid #dedfd5; }
    .brand { display:flex; align-items:center; gap:11px; font-size:16px; font-weight:650; letter-spacing:3px; }
    .brand-icon { width:34px; height:34px; background:#e8ecdf; border-radius:50%; display:grid; place-items:center; }
    .brand-icon svg { width:23px; height:23px; }
    .edition { font-size:10px; letter-spacing:2.7px; color:#81877b; }
    .intro { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin:35px 0 28px; }
    .eyebrow { display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:2.2px; color:#829078; margin:0 0 13px; }

    .intro p { color:#8a8e85; font-size:12px; line-height:2; margin:0 0 2px; letter-spacing:1.3px; text-align:right; }
    .scene-card { position:relative; overflow:hidden; border-radius:14px; background:#182a3c; box-shadow:0 12px 32px #23382e0a; }
    .scene { display:block; width:100%; height:auto; }
    .location { position:absolute; z-index:2; top:25px; left:28px; display:flex; gap:9px; align-items:center; color:#e6eadc; font-size:10px; letter-spacing:2px; }
    .location svg { width:13px; height:13px; opacity:.7; }
    .live-label { position:absolute; right:27px; top:25px; display:flex; gap:7px; align-items:center; color:#e1e6d0; font-size:9px; letter-spacing:1.8px; }
    .live-label i { width:5px; height:5px; background:#d7dfa4; border-radius:50%; box-shadow:0 0 8px #e5e8a94d; }
    .scene-caption { position:absolute; left:29px; bottom:23px; color:#ebe6d2; font-family:"Songti SC","SimSun",serif; font-size:12px; letter-spacing:3px; opacity:.75; }
    .scene-number { position:absolute; right:29px; bottom:23px; color:#dddcc9; font-size:9px; letter-spacing:2px; opacity:.6; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 2px 23px; border-bottom:1px solid #dedfd5; }
    .controls { display:flex; align-items:center; gap:13px; }
    .play { border:0; border-radius:50%; width:40px; height:40px; background:var(--green); color:#fff; display:grid; place-items:center; cursor:pointer; transition:background .2s, transform .2s; }
    .play:hover { background:#3f5841; transform:scale(1.04); }
    .play svg { width:16px; height:16px; }
    .play-text { min-width:66px; font-size:11px; letter-spacing:1px; color:#636f5f; }
    .divider { width:1px; height:21px; background:#dcded3; margin:0 8px; }
    .speed-label { font-size:10px; color:#91988b; margin-right:2px; letter-spacing:1px; }
    .speed-group { display:flex; background:#eaece3; padding:4px; border-radius:24px; gap:2px; }
    .speed-group button { border:0; background:transparent; color:#858d7c; border-radius:20px; padding:7px 13px; font-size:10px; cursor:pointer; transition:background .2s,color .2s; }
    .speed-group button[aria-pressed="true"] { background:var(--paper); color:#4b6446; box-shadow:0 1px 5px #2335190b; }
    .scene-switch { display:flex; align-items:center; gap:8px; border:1px solid #d7dccc; border-radius:22px; background:transparent; padding:10px 15px; cursor:pointer; color:#66705e; font-size:11px; letter-spacing:1px; transition:background .2s; }
    .scene-switch:hover { background:#e9ecdf; }
    .scene-switch svg { width:14px; height:14px; }
    .hint { font-size:10px; color:#a0a394; letter-spacing:1px; margin-left:auto; margin-right:12px; }
    footer { display:flex; justify-content:space-between; align-items:center; gap:18px; padding-top:19px; font-size:10px; color:#9c9f91; letter-spacing:1px; }
    footer .note { display:flex; align-items:center; gap:8px; }
    .tiny-flower { color:#a0a789; font-size:16px; }
    .night-layer,.day-layer { transition:opacity 1.4s ease; }
    .day-layer { opacity:0; }
    .day .day-layer { opacity:1; }
    .day .night-layer { opacity:0; }
    .day .location,.day .live-label { color:#3e5965; }
    .day .live-label i { background:#648975; box-shadow:none; }
    .star { animation:twinkle 4s ease-in-out infinite alternate; }
    .star:nth-child(3n) { animation-delay:-2.4s; }
    .star:nth-child(2n) { animation-delay:-1.1s; }
    .spark { animation:twinkle 2.8s ease-in-out infinite alternate; }
    .paused .star,.paused .spark { animation-play-state:paused; }

    @media(max-width:760px) {
      .page { padding:22px 20px; } header { padding-bottom:20px; } .edition { font-size:8px; letter-spacing:1px; }

      .intro p { margin-top:14px; text-align:left; font-size:11px; } .intro p br { display:none; }
      h1 { letter-spacing:2px; } .scene-card { border-radius:11px; } .scene { width:140%; max-width:none; margin-left:-20%; }
      .location { left:15px; top:15px; font-size:8px; letter-spacing:1px; } .live-label { right:15px; top:15px; font-size:7px; }
      .scene-caption { left:16px; bottom:15px; font-size:9px; letter-spacing:2px; } .scene-number { right:15px; bottom:15px; font-size:7px; }
      .toolbar { flex-wrap:wrap; padding:18px 0; gap:14px; } .controls { gap:9px; } .play-text { min-width:52px; font-size:10px; }
      .divider { margin:0 3px; } .speed-label,.hint { display:none; } .speed-group button { padding:7px 10px; }
      .scene-switch { padding:9px 12px; font-size:10px; } footer { align-items:flex-start; line-height:1.8; font-size:9px; } footer .credit { max-width:110px; text-align:right; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const sceneCard = $('sceneCard');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let speed = 1;
      let time = 0;
      let previous = null;
      let animationFrame = null;
      const parts = Object.fromEntries(['backWheel','frontWheel','farLegPath','nearLegPath','farShoe','nearShoe','crank','farPedal','nearPedal','dog','dogTail','dogEar','dogHead','dogTongue','dogFarBack','dogFarFront','dogNearBack','dogNearFront','dogBackPaw','dogFrontPaw','dogShadow','railing','movingRoad','waterRipples','grasses','boat','hairBack','hairLock','basketFlowers','girlEye','skirtBody','skirtHem','legRevealPath','skirtFolds','skirtShade','skirtHighlight','breeze'].map(id => [id, $(id)]));
      const point = (x,y) => `${x.toFixed(2)} ${y.toFixed(2)}`;
      // Two-segment inverse kinematics keeps each ankle attached to its pedal.
      function leg(hip, ankle, upper, lower) {
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const distance = Math.max(0.01, Math.hypot(dx,dy));
        const d = Math.min(distance, upper + lower - 0.01);
        const a = (upper * upper - lower * lower + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, upper * upper - a * a));
        const knee = { x:hip.x + a * dx / distance + h * dy / distance, y:hip.y + a * dy / distance - h * dx / distance };
        return { knee, path:`M${point(hip.x,hip.y)} L${point(knee.x,knee.y)} L${point(ankle.x,ankle.y)}` };
      }
      function drawSkirt(t, nearKnee, farKnee) {
        // Keep the waistband fixed. Fabric follows thigh elevation, with a small wind ripple.
        const flutter = Math.sin(t*5.6)*1.8;
        // The front edge follows the thigh without folding into a sharp point over the knee.
        const hemX = nearKnee.x + 19;
        const hemY = Math.max(522, Math.min(547, 524 + (nearKnee.y-502)*.55));
        const backY = 534 + (farKnee.y-531)*.06 + flutter;
        const middleY = (hemY + backY)*.5 + 3;
        parts.skirtBody.setAttribute('d', `M760 478Q792 493 828 481Q${point(hemX-17,465)} ${point(hemX,hemY)}Q${point(hemX-28,hemY+6)} ${point(798,middleY)}Q${point(765,backY+3)} ${point(749,backY)}Q749 503 760 478Z`);
        parts.skirtHem.setAttribute('d', `M${point(750,backY-5)}Q${point(767,backY-2)} ${point(798,middleY-5)}Q${point(hemX-28,hemY+1)} ${point(hemX-2,hemY-5)}`);
        parts.legRevealPath.setAttribute('d', `M700 ${(backY+2).toFixed(2)}L${point(749,backY+2)}Q${point(765,backY+5)} ${point(798,middleY+2)}Q${point(hemX-28,hemY+8)} ${point(hemX,hemY+2)}H960V710H700Z`);
        parts.skirtFolds.setAttribute('d', `M810 495Q${point(820,hemY-13)} ${point(hemX-17,hemY-6)}M794 498Q${point(789,middleY-20)} ${point(798,middleY-6)}M759 ${backY-13}Q774 ${backY-20} 786 ${backY-12}`);
        parts.skirtShade.setAttribute('d', `M809 493Q${point(822,hemY-19)} ${point(hemX-4,hemY-4)}L${point(hemX-28,hemY+1)}Q${point(810,hemY-15)} 809 493Z`);
        parts.skirtHighlight.setAttribute('d', `M782 494Q788 ${middleY-20} 796 ${middleY-3}L811 ${middleY}Q801 ${middleY-18} 797 495Z`);
      }
      function draw(t) {
        const cycle = t * 2.8;
        const wheelAngle = cycle * 180 / Math.PI * 1.32;
        parts.backWheel.setAttribute('transform', `translate(720 616) rotate(${wheelAngle})`);
        parts.frontWheel.setAttribute('transform', `translate(1012 616) rotate(${wheelAngle})`);
        const near = { x:849 + Math.cos(cycle) * 30, y:605 + Math.sin(cycle) * 30 };
        const far = { x:849 - Math.cos(cycle) * 30, y:605 - Math.sin(cycle) * 30 };
        const nearLeg = leg({x:798,y:505}, {x:near.x-3,y:near.y-13}, 66, 68);
        const farLeg = leg({x:791,y:501}, {x:far.x-3,y:far.y-13}, 66, 68);
        parts.nearLegPath.setAttribute('d', nearLeg.path);
        parts.farLegPath.setAttribute('d', farLeg.path);
        drawSkirt(t, nearLeg.knee, farLeg.knee);
        parts.nearShoe.setAttribute('transform', `translate(${near.x-3} ${near.y-11}) rotate(${Math.sin(cycle)*7})`);
        parts.farShoe.setAttribute('transform', `translate(${far.x-3} ${far.y-11}) rotate(${-Math.sin(cycle)*7})`);
        parts.crank.setAttribute('d', `M${point(far.x,far.y)}L${point(near.x,near.y)}`);
        parts.nearPedal.setAttribute('transform', `translate(${near.x} ${near.y+2})`);
        parts.farPedal.setAttribute('transform', `translate(${far.x} ${far.y+2})`);
        const run = t * 6.3;
        const bob = Math.cos(run*2)*2.5;
        parts.dog.setAttribute('transform', `translate(0 ${bob})`);
        const dogLeg = (id, x, y, phase, isHind, pawId) => {
          const progress = ((run + phase) % (Math.PI*2)) / (Math.PI*2);
          const stance = .56;
          const groundSpeed = 110; // Match the foreground road's leftward motion.
          const stride = groundSpeed * (Math.PI*2 / 6.3) * stance;
          let footX, lift = 0, pawAngle = 0;
          if (progress < stance) {
            // Planted paw: move from front to back at road speed, staying on the ground.
            footX = x + stride*.5 - stride*(progress/stance);
          } else {
            // Recovery: lift the paw and carry it from behind the body to the front.
            const swing = (progress-stance)/(1-stance);
            footX = x - stride*.5 + stride*(.5-.5*Math.cos(Math.PI*swing));
            lift = Math.sin(Math.PI*swing)**2 * 28;
            pawAngle = -Math.sin(Math.PI*swing)*18;
          }
          const footY = 697 - bob - lift;
          const jointX = isHind ? x+18+(footX-x)*.2 : x-9+(footX-x)*.35;
          const jointY = y+29-lift*.2;
          const ankleX = footX + (isHind ? -12 : -3);
          const ankleY = footY-17;
          parts[id].setAttribute('d', `M${point(x,y)}Q${point(jointX,jointY-12)} ${point(jointX,jointY)}L${point(ankleX,ankleY)}L${point(footX,footY)}`);
          if (pawId) parts[pawId].setAttribute('transform', `translate(${footX} ${footY}) rotate(${pawAngle})`);
        };
        // Diagonal pairs alternate, giving a forward-moving trot rather than a reversed cycle.
        dogLeg('dogFarBack',404,619,Math.PI,true);
        dogLeg('dogFarFront',492,615,0,false);
        dogLeg('dogNearBack',405,618,0,true,'dogBackPaw');
        dogLeg('dogNearFront',494,614,Math.PI,false,'dogFrontPaw');
        parts.dogTail.setAttribute('transform', `rotate(${Math.sin(run*1.3)*12} 396 611)`);
        parts.dogEar.setAttribute('transform', `rotate(${Math.sin(run+.3)*12} 513 537)`);
        parts.dogHead.setAttribute('transform', `rotate(${Math.sin(run)*2} 509 588)`);
        parts.dogTongue.setAttribute('transform', `rotate(${Math.sin(run)*9} 560 580)`);
        parts.dogShadow.setAttribute('rx', 109 + bob*1.4);
        parts.hairBack.setAttribute('transform', `rotate(${Math.sin(t*3)*1.8} 820 300)`);
        parts.hairLock.setAttribute('transform', `rotate(${Math.sin(t*3+.8)*2} 810 340)`);
        parts.basketFlowers.setAttribute('transform', `rotate(${Math.sin(t*3.2)*3} 1021 455)`);
        const blink = t % 5.2;
        const eyeOpen = 1 - Math.max(0, 1-Math.abs(blink-5.02)/.11)*.92;
        parts.girlEye.setAttribute('transform', `translate(0 323) scale(1 ${eyeOpen}) translate(0 -323)`);
        parts.railing.setAttribute('transform', `translate(${-((t*58)%180)} 0)`);
        parts.movingRoad.setAttribute('transform', `translate(${-((t*110)%260)} 0)`);
        parts.waterRipples.setAttribute('transform', `translate(${-((t*12)%230)} 0)`);
        parts.grasses.setAttribute('transform', `translate(${-((t*110)%1440)} 0)`);
        parts.boat.setAttribute('transform', `translate(${1490-((t*9+280)%1650)} ${489+Math.sin(t)*1.3})`);
        parts.breeze.setAttribute('opacity', .2 + (Math.sin(t*2)+1)*.13);
      }
      function tick(now) {
        animationFrame = null;
        if (!playing || document.hidden) { previous = null; return; }
        if (previous !== null) time += Math.min((now-previous)/1000,.06)*speed;
        previous = now;
        draw(time);
        animationFrame = requestAnimationFrame(tick);
      }
      function startLoop() {
        if (animationFrame === null && playing && !document.hidden) {
          previous = null;
          animationFrame = requestAnimationFrame(tick);
        }
      }
      function updatePlayback() {
        sceneCard.classList.toggle('paused', !playing);
        $('playButton').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        $('playButton').setAttribute('aria-pressed', String(!playing));
        $('playText').textContent = playing ? '骑行中' : '歇一会儿';
        $('pauseIcon').style.display = playing ? '' : 'none';
        $('playIcon').style.display = playing ? 'none' : '';
        if (!playing && animationFrame !== null) { cancelAnimationFrame(animationFrame); animationFrame = null; previous = null; }
        startLoop();
      }
      $('playButton').addEventListener('click', () => { playing = !playing; updatePlayback(); });
      document.querySelectorAll('[data-speed]').forEach(button => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          document.querySelectorAll('[data-speed]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
        });
      });
      $('themeButton').addEventListener('click', () => {
        const isDay = sceneCard.classList.toggle('day');
        $('themeButton').setAttribute('aria-pressed', String(isDay));
        $('themeButton').setAttribute('aria-label', isDay ? '切换到夜晚' : '切换到白天');
        $('themeText').textContent = isDay ? '等一场星光' : '换个好天气';
        $('sceneLabel').textContent = isDay ? '晴日漫游' : '星光夜骑';
        $('sceneTitle').textContent = isDay ? '女孩与大黄狗的珠江日间骑行' : '女孩与大黄狗的珠江夜骑';
        $('sceneDescription').textContent = `黑色长发、穿浅色碎花上衣和蓝色牛仔裙的女孩骑着绿色自行车，一只大黄狗在后面跟跑。背景是广州塔和${isDay ? '阳光下的珠江' : '星月照耀的珠江夜景'}。`;
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animationFrame !== null) cancelAnimationFrame(animationFrame);
          animationFrame = null; previous = null;
        } else startLoop();
      });
      motionPreference.addEventListener('change', event => {
        if (event.matches) { playing = false; updatePlayback(); }
      });
      draw(0.35);
      updatePlayback();
    })();
  </script>
</body>
